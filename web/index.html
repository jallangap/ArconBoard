<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="/eel.js"></script>
    <link rel="stylesheet" href="css/styles.css">

<body class="bg-slate-900 text-slate-200 h-screen flex flex-col justify-center items-center font-sans antialiased">
    
    <div class="text-center max-w-lg p-10 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-bold mb-4 text-cyan-400">Auditoría Presupuestaria</h1>
        <p class="text-slate-400 mb-8 text-sm">El motor de análisis está en espera. Cargue el archivo Excel de ejecución financiera para inicializar el entorno[cite: 7, 8].</p>
        
        <button id="btn-cargar" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 px-6 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:-translate-y-1 flex items-center justify-center w-full">
            <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Cargar Archivo Excel
        </button>
        
        <div id="status-message" class="mt-6 text-sm hidden"></div>
    </div>

    <script src="js/main.js"></script>

</html>
